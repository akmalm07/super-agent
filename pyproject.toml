[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "super-agent"
version = "0.1.0"
description = "User-controlled, multi-stage software delivery harness"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "SQLAlchemy>=2.0,<2.1",
]

[project.scripts]
super-agent = "agent.cli:main"
agent = "agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent"]
exclude = ["agent.test"]

[tool.setuptools.package-data]
agent = ["prompt_templates/*.txt"]
